<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Checkers Clash — ArenaX</title>
  <meta name="description" content="Premium Checkers for ArenaX — play vs AI with 3 difficulties or local 1v1." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060608;
      --panel: rgba(18,18,24,.88);
      --panel-2: rgba(26,26,34,.94);
      --line: rgba(255,225,150,.14);
      --line-strong: rgba(255,225,150,.32);
      --gold: #d8a43b;
      --gold-light: #ffe7a6;
      --gold-deep: #8b6118;
      --gold-gradient: linear-gradient(135deg,#fff2b8 0%,#d8a43b 45%,#8b6118 100%);
      --text: #faf5ea;
      --muted: #b7ab95;
      --muted-2: #7d7263;
      --success: #53dc93;
      --danger: #f25c5c;
      --red: #e14b4b;
      --cream: #f5efe2;
      --board-dark: #202025;
      --board-light: #f0e5cf;
      --shadow: 0 30px 90px rgba(0,0,0,.62);
      --font-display: "Orbitron", sans-serif;
      --font-body: "Inter", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(700px circle at 15% 0%, rgba(216,164,59,.12), transparent 55%),
        radial-gradient(700px circle at 90% 100%, rgba(139,97,24,.14), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: hidden;
    }
    button { font: inherit; cursor: pointer; border: none; }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: rgba(10,10,14,.82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .back-btn {
      width: 40px; height: 40px; border-radius: 13px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      color: var(--text);
      display: grid; place-items: center;
      font-size: 17px;
      transition: .2s;
      flex: 0 0 auto;
    }
    .back-btn:hover { border-color: var(--line-strong); background: rgba(255,225,150,.08); }
    .topbar h1 {
      font-family: var(--font-display);
      font-size: 19px;
      display: flex; align-items: center; gap: 8px;
      letter-spacing: -.02em;
    }
    .topbar h1 .gold {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .top-actions { margin-left: auto; display: flex; gap: 8px; }

    .layout {
      width: min(1260px, 100%);
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 16px;
      align-items: start;
    }
    .board-wrap { width: 100%; max-width: 760px; margin: 0 auto; position: relative; }
    .board-frame {
      position: relative;
      border-radius: 28px;
      padding: clamp(10px, 1.6vw, 18px);
      background: linear-gradient(160deg, rgba(255,231,166,.14), rgba(20,20,26,.95) 40%), rgba(16,16,22,.95);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow), inset 0 0 40px rgba(216,164,59,.05);
    }

    svg#board { display: block; width: 100%; height: auto; border-radius: 18px; }

    .turn-banner {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 5;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(12,12,16,.85);
      border: 1px solid var(--line-strong);
      backdrop-filter: blur(10px);
      font-weight: 900; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 10px 26px rgba(0,0,0,.5);
      white-space: nowrap;
    }
    .turn-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }

    .side {
      display: grid;
      gap: 12px;
      position: sticky;
      top: 76px;
    }
    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(20px);
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .players { display: grid; gap: 10px; }
    .player-card {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      border-radius: 17px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
      position: relative;
      overflow: hidden;
      transition: .25s;
    }
    .player-card.active {
      border-color: var(--line-strong);
      background: linear-gradient(90deg, rgba(255,225,150,.10), rgba(255,255,255,.02));
      box-shadow: inset 3px 0 0 var(--gold), 0 8px 22px rgba(0,0,0,.3);
    }
    .player-card.active::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,231,166,.07) 45%, transparent 60%);
      animation: sweep 2.2s ease infinite;
    }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .p-avatar {
      width: 42px; height: 42px; border-radius: 14px;
      display: grid; place-items: center;
      font-size: 19px; font-weight: 900;
      flex: 0 0 auto;
      border: 2px solid rgba(255,255,255,.25);
      box-shadow: 0 6px 16px rgba(0,0,0,.4);
    }
    .p-info { min-width: 0; flex: 1; }
    .p-name { font-weight: 800; font-size: 14.5px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .p-tag {
      font-size: 9px; font-weight: 900; letter-spacing: .1em;
      padding: 3px 7px; border-radius: 999px;
      background: rgba(255,225,150,.12); color: var(--gold-light);
      border: 1px solid var(--line);
    }
    .p-sub { color: var(--muted); font-size: 11.5px; margin-top: 3px; }

    .timer-track { height: 6px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; margin-top: 12px; }
    .timer-fill {
      height: 100%; width: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--gold-deep), var(--gold-light));
      box-shadow: 0 0 10px rgba(216,164,59,.5);
      transition: width 1s linear;
    }
    .timer-fill.low { background: linear-gradient(90deg, #8a2f2f, var(--danger)); }

    .controls {
      display: flex; gap: 12px; align-items: center;
    }
    .controls .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .controls .hint b { color: var(--gold-light); display: block; font-size: 13px; margin-bottom: 3px; }

    .btn {
      border-radius: 999px; padding: 12px 20px;
      background: var(--gold-gradient);
      color: #140d04;
      font-weight: 900; font-size: 13.5px;
      box-shadow: 0 0 30px rgba(216,164,59,.22), inset 0 1px 0 rgba(255,255,255,.45);
      transition: transform .18s, box-shadow .18s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(216,164,59,.35), 0 12px 24px rgba(0,0,0,.35); }
    .btn.secondary {
      background: rgba(255,255,255,.05);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    .btn.secondary:hover { border-color: var(--line-strong); background: rgba(255,225,150,.08); }

    .log { max-height: 230px; overflow-y: auto; display: grid; gap: 6px; font-size: 12.5px; }
    .log-item {
      padding: 7px 11px;
      border-radius: 11px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.045);
      color: var(--muted);
      animation: logIn .3s ease both;
    }
    .log-item b { color: var(--text); }
    @keyframes logIn { from { opacity: 0; transform: translateY(-6px);} to { opacity: 1; transform: none;} }

    .piece { cursor: default; transition: filter .2s; }
    .piece.movable { cursor: pointer; animation: tokenPulse 1s ease-in-out infinite; }
    @keyframes tokenPulse {
      0%,100% { filter: drop-shadow(0 0 3px rgba(255,231,166,.9)); }
      50% { filter: drop-shadow(0 0 12px rgba(255,231,166,1)); }
    }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(9px);
      display: none; place-items: center;
      padding: 16px;
      animation: fadeBk .25s ease both;
    }
    @keyframes fadeBk { from { opacity: 0; } to { opacity: 1; } }
    .modal-backdrop.show { display: grid; }
    .modal {
      width: min(480px, 100%);
      border-radius: 28px;
      padding: 26px;
      background: var(--panel-2);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow);
      animation: popIn .35s cubic-bezier(.2,.7,.3,1.15) both;
      position: relative; overflow: hidden;
    }
    @keyframes popIn { from { opacity: 0; transform: scale(.92) translateY(14px);} to { opacity: 1; transform: none;} }
    .modal::before {
      content: ""; position: absolute; top: 0; left: 12%; right: 12%; height: 2px;
      background: var(--gold-gradient); filter: blur(1px);
    }
    .modal h2 { font-family: var(--font-display); font-size: 24px; text-align: center; margin-bottom: 6px; }
    .modal .sub { color: var(--muted); text-align: center; font-size: 13px; margin-bottom: 20px; }
    .mode-grid { display: grid; gap: 11px; }
    .mode-card {
      display: flex; align-items: center; gap: 14px;
      padding: 16px;
      border-radius: 19px;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--line);
      color: var(--text);
      text-align: left;
      transition: .22s;
      width: 100%;
    }
    .mode-card:hover { transform: translateY(-3px); border-color: var(--line-strong); box-shadow: 0 16px 34px rgba(0,0,0,.35), 0 0 26px rgba(216,164,59,.12); }
    .mode-card .m-ico {
      width: 52px; height: 52px; border-radius: 16px;
      display: grid; place-items: center;
      font-size: 25px;
      background: rgba(255,225,150,.08);
      border: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .mode-card strong { display: block; font-size: 15.5px; margin-bottom: 3px; }
    .mode-card span { color: var(--muted); font-size: 12px; line-height: 1.45; display: block; }

    .diff-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-top: 4px; }
    .diff-btn {
      padding: 14px 8px; border-radius: 15px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 800; font-size: 13px;
      transition: .2s;
    }
    .diff-btn small { display: block; color: var(--muted); font-weight: 600; font-size: 10.5px; margin-top: 4px; }
    .diff-btn:hover { border-color: var(--line-strong); transform: translateY(-2px); }
    .diff-btn.selected {
      background: linear-gradient(150deg, rgba(255,231,166,.16), rgba(216,164,59,.06));
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(216,164,59,.18);
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions .btn { flex: 1; }

    .confetti-bit {
      position: fixed; top: -12px; z-index: 300;
      width: 10px; height: 14px;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
      .side { position: static; }
    }
    @media (max-width: 640px) {
      .topbar h1 { font-size: 16px; }
      .turn-banner { font-size: 11.5px; padding: 7px 13px; }
      .diff-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="back-btn" onclick="location.assign('../index.html')" title="Back to ArenaX">←</button>
    <h1>🔴 CHECKERS <span class="gold">CLASH</span></h1>
    <div class="top-actions">
      <button class="back-btn" id="soundBtn" title="Toggle sound">🔊</button>
      <button class="back-btn" id="menuBtn" title="Menu">☰</button>
    </div>
  </header>

  <div class="layout">
    <div class="board-wrap">
      <div class="board-frame">
        <div class="turn-banner" id="turnBanner"><span class="turn-dot" id="turnDot"></span><span id="turnText">Welcome</span></div>
        <svg id="board" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

    <aside class="side">
      <div class="panel">
        <div class="players" id="players"></div>
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      </div>

      <div class="panel">
        <div class="controls">
          <button class="btn" id="restartBtn">New Match</button>
          <div class="hint" id="hint"><b>Choose a mode</b>Start a match to begin.</div>
        </div>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div style="color:var(--muted-2);font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;">Match Log</div>
          <button class="btn secondary" style="padding:7px 13px;font-size:11px;" onclick="showMenu()">Modes</button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </aside>
  </div>

  <div class="modal-backdrop show" id="menuModal">
    <div class="modal">
      <h2>🔴 CHECKERS <span style="background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;">CLASH</span></h2>
      <div class="sub">Classic captures, premium ArenaX visuals. Choose your battle.</div>
      <div class="mode-grid">
        <button class="mode-card" onclick="pickMode('ai')">
          <div class="m-ico">🤖</div>
          <div><strong>Play vs AI</strong><span>Battle the computer with 3 difficulty levels.</span></div>
        </button>
        <button class="mode-card" onclick="pickMode('local')">
          <div class="m-ico">👥</div>
          <div><strong>Pass &amp; Play</strong><span>Two players on the same device.</span></div>
        </button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="aiModal">
    <div class="modal">
      <h2>Choose Difficulty</h2>
      <div class="sub">How sharp should the opponent be?</div>
      <div class="diff-row">
        <button class="diff-btn" data-diff="easy">😌 Easy<small>Casual play</small></button>
        <button class="diff-btn selected" data-diff="medium">🧐 Medium<small>Smart captures</small></button>
        <button class="diff-btn" data-diff="hard">😈 Hard<small>Sharper tactics</small></button>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" onclick="backToMenu()">Back</button>
        <button class="btn" onclick="startAIGame()">Start Match</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    const svgNS = 'http://www.w3.org/2000/svg';
    const CELL = 100;
    const PAD = 12;
    const LIGHT = 1;
    const DARK = 2;

    const S = {
      mode: null,
      difficulty: 'medium',
      board: [],
      turn: DARK,
      selected: null,
      validMoves: [],
      forcedFrom: null,
      gameOver: false,
      winner: null,
      players: {},
      timer: null,
      timerLeft: 20,
      animating: false
    };

    const $ = id => document.getElementById(id);
    const pieceEls = new Map();
    let audioCtx = null;
    let soundOn = localStorage.getItem('checkers_sound') !== 'off';

    function ac() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
    function beep(freq, dur, type, vol, when) {
      if (!soundOn) return;
      try {
        const ctx = ac(), o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type || 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(vol || .12, ctx.currentTime + (when || 0));
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + (when || 0) + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + (when || 0)); o.stop(ctx.currentTime + (when || 0) + dur);
      } catch (e) {}
    }
    const sfx = {
      move: () => beep(440,.05,'sine',.08),
      capture: () => { beep(330,.08,'square',.12); beep(180,.15,'square',.12,.08); },
      king: () => { beep(660,.1,'triangle',.12); beep(880,.14,'triangle',.12,.1); },
      win: () => { [523,659,784,988].forEach((f,i)=>beep(f,.18,'triangle',.13,i*.12)); },
      error: () => beep(150,.18,'square',.1)
    };

    function mk(tag, attrs, parent) {
      const el = document.createElementNS(svgNS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(el);
      return el;
    }

    function initBoardState() {
      const b = Array.from({ length: 8 }, () => Array(8).fill(null));
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) b[r][c] = { side: LIGHT, king: false };
      }
      for (let r = 5; r < 8; r++) {
        for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) b[r][c] = { side: DARK, king: false };
      }
      return b;
    }

    function buildBoard() {
      const svg = $('board');
      svg.innerHTML = '';
      const defs = mk('defs', {}, svg);
      defs.innerHTML = `
        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2b2b34"/><stop offset="100%" stop-color="#16161c"/>
        </linearGradient>
        <radialGradient id="piece-dark" cx="35%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#ff8b8b"/><stop offset="60%" stop-color="#e14b4b"/><stop offset="100%" stop-color="#821c1c"/>
        </radialGradient>
        <radialGradient id="piece-light" cx="35%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#fffef8"/><stop offset="60%" stop-color="#f4e7c9"/><stop offset="100%" stop-color="#b8a37a"/>
        </radialGradient>
        <radialGradient id="kingGlow" cx="50%" cy="50%" r="70%">
          <stop offset="0%" stop-color="#ffe7a6"/><stop offset="100%" stop-color="#d8a43b"/>
        </radialGradient>`;

      mk('rect', { x:0, y:0, width:800, height:800, rx:20, fill:'url(#frameGrad)' }, svg);
      const board = mk('g', { transform:`translate(${PAD},${PAD})` }, svg);

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const dark = (r + c) % 2 === 1;
          mk('rect', {
            x: c * CELL, y: r * CELL,
            width: CELL, height: CELL,
            fill: dark ? 'var(--board-dark)' : 'var(--board-light)',
            stroke: dark ? '#2e2e34' : '#ded1b7',
            'stroke-width': 1
          }, board);
        }
      }

      mk('g', { id:'highlightLayer', transform:`translate(${PAD},${PAD})` }, svg);
      mk('g', { id:'pieceLayer', transform:`translate(${PAD},${PAD})` }, svg);
      renderHighlights();
      buildPieces();
    }

    function coord(row, col) { return { x: col * CELL + CELL / 2, y: row * CELL + CELL / 2 }; }

    function buildPieces() {
      const layer = $('pieceLayer');
      layer.innerHTML = '';
      pieceEls.clear();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = S.board[r][c];
          if (!piece) continue;
          const g = mk('g', { class:'piece-group', 'data-row':r, 'data-col':c }, layer);
          const fill = piece.side === DARK ? 'url(#piece-dark)' : 'url(#piece-light)';
          mk('circle', { class:'piece', r: 34, fill, stroke:'rgba(255,255,255,.65)', 'stroke-width': 3 }, g);
          mk('circle', { r: 24, fill:'rgba(255,255,255,.10)', stroke:'rgba(0,0,0,.16)', 'stroke-width': 2 }, g);
          mk('circle', { r: 8, cx:-10, cy:-10, fill:'rgba(255,255,255,.55)', opacity:.65 }, g);
          if (piece.king) {
            mk('circle', { r: 12, fill:'url(#kingGlow)', stroke:'rgba(255,255,255,.6)', 'stroke-width': 2 }, g);
            const t = mk('text', { x:0, y:6, 'text-anchor':'middle', 'font-size':18, 'font-weight':900, fill:'#241603' }, g);
            t.textContent = '♛';
          }
          const p = coord(r, c);
          g.style.transform = `translate(${p.x}px, ${p.y}px)`;
          g.addEventListener('click', () => onPieceClick(r, c));
          pieceEls.set(`${r}-${c}`, g);
        }
      }
    }

    function renderHighlights() {
      const layer = $('highlightLayer');
      layer.innerHTML = '';
      if (S.selected) {
        const p = coord(S.selected.row, S.selected.col);
        mk('circle', { cx:p.x, cy:p.y, r:38, fill:'none', stroke:'rgba(255,231,166,.9)', 'stroke-width':5, opacity:.9 }, layer);
      }
      for (const m of S.validMoves) {
        const p = coord(m.to.row, m.to.col);
        mk('circle', { cx:p.x, cy:p.y, r:15, fill:m.captures.length ? 'rgba(242,92,92,.85)' : 'rgba(255,231,166,.85)', stroke:'rgba(255,255,255,.7)', 'stroke-width':3 }, layer);
      }
    }

    function sideName(side) { return side === DARK ? 'You' : (S.mode === 'ai' ? aiName() : 'Player 2'); }
    function currentSideName() { return sideName(S.turn); }
    function aiName() { return S.difficulty === 'easy' ? 'Bolt (Easy)' : S.difficulty === 'medium' ? 'Vex (Medium)' : 'Nova (Hard)'; }

    function renderPlayers() {
      const darkCount = countPieces(DARK), lightCount = countPieces(LIGHT);
      $('players').innerHTML = `
        <div class="player-card ${S.turn === DARK && !S.gameOver ? 'active' : ''}">
          <div class="p-avatar" style="background:linear-gradient(135deg,#ff8b8b,#e14b4b);color:#fff;">🔴</div>
          <div class="p-info">
            <div class="p-name">${S.mode === 'local' ? 'Player 1' : 'You'} <span class="p-tag">DARK</span></div>
            <div class="p-sub">${darkCount} pieces left</div>
          </div>
        </div>
        <div class="player-card ${S.turn === LIGHT && !S.gameOver ? 'active' : ''}">
          <div class="p-avatar" style="background:linear-gradient(135deg,#fffef8,#f4e7c9);color:#3a2c10;">⚪</div>
          <div class="p-info">
            <div class="p-name">${S.mode === 'ai' ? aiName() : 'Player 2'} <span class="p-tag">LIGHT</span></div>
            <div class="p-sub">${lightCount} pieces left</div>
          </div>
        </div>`;
    }

    function log(html) {
      const el = document.createElement('div');
      el.className = 'log-item';
      el.innerHTML = html;
      $('log').prepend(el);
      while ($('log').children.length > 30) $('log').lastChild.remove();
    }

    function setBanner(text, side) {
      $('turnText').textContent = text;
      const color = side === DARK ? 'var(--red)' : 'var(--gold-light)';
      $('turnDot').style.background = color;
      $('turnDot').style.color = color;
    }
    function setHint(html) { $('hint').innerHTML = html; }

    function startTimer() {
      stopTimer();
      if (S.gameOver) return;
      S.timerLeft = 20;
      updateTimerBar();
      S.timer = setInterval(() => {
        S.timerLeft--;
        updateTimerBar();
        if (S.timerLeft <= 0) {
          stopTimer();
          if (S.validMoves.length) {
            const move = S.validMoves[Math.floor(Math.random() * S.validMoves.length)];
            applyMove(move);
            log(`<b>${currentSideName()}</b> ran out of time — auto move.`);
          }
        }
      }, 1000);
    }
    function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
    function updateTimerBar() {
      $('timerFill').style.width = (S.timerLeft / 20 * 100) + '%';
      $('timerFill').classList.toggle('low', S.timerLeft <= 5);
    }

    function countPieces(side) {
      let n = 0;
      for (const row of S.board) for (const p of row) if (p && p.side === side) n++;
      return n;
    }

    function inside(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
    function dirsFor(piece) {
      if (piece.king) return [[1,-1],[1,1],[-1,-1],[-1,1]];
      return piece.side === DARK ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
    }

    function cloneBoard(board) {
      return board.map(row => row.map(cell => cell ? { ...cell } : null));
    }

    function getSimpleMoves(board, r, c) {
      const piece = board[r][c];
      if (!piece) return [];
      const moves = [];
      for (const [dr, dc] of dirsFor(piece)) {
        const nr = r + dr, nc = c + dc;
        if (inside(nr, nc) && !board[nr][nc]) {
          moves.push({ from:{row:r,col:c}, to:{row:nr,col:nc}, captures:[] });
        }
      }
      return moves;
    }

    function getCaptureMoves(board, r, c) {
      const piece = board[r][c];
      if (!piece) return [];
      const moves = [];
      for (const [dr, dc] of dirsFor(piece)) {
        const mr = r + dr, mc = c + dc;
        const lr = r + dr * 2, lc = c + dc * 2;
        if (!inside(mr, mc) || !inside(lr, lc)) continue;
        if (board[mr][mc] && board[mr][mc].side !== piece.side && !board[lr][lc]) {
          moves.push({ from:{row:r,col:c}, to:{row:lr,col:lc}, captures:[{row:mr,col:mc}] });
        }
      }
      return moves;
    }

    function allMovesForSide(side) {
      let captures = [];
      let normals = [];
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = S.board[r][c];
          if (!p || p.side !== side) continue;
          captures = captures.concat(getCaptureMoves(S.board, r, c));
          normals = normals.concat(getSimpleMoves(S.board, r, c));
        }
      }
      return captures.length ? captures : normals;
    }

    function movesForPiece(r, c) {
      const piece = S.board[r][c];
      if (!piece || piece.side !== S.turn) return [];
      const all = allMovesForSide(S.turn);
      if (all.some(m => m.captures.length)) {
        return all.filter(m => m.from.row === r && m.from.col === c && m.captures.length);
      }
      return all.filter(m => m.from.row === r && m.from.col === c);
    }

    function onPieceClick(r, c) {
      if (S.gameOver || S.animating) return;
      const piece = S.board[r][c];
      if (!piece || piece.side !== S.turn) { sfx.error(); return; }
      if (S.mode === 'ai' && S.turn === LIGHT) return;
      if (S.forcedFrom && (S.forcedFrom.row !== r || S.forcedFrom.col !== c)) { sfx.error(); return; }
      S.selected = { row:r, col:c };
      S.validMoves = movesForPiece(r, c);
      renderHighlights();
      if (!S.validMoves.length) sfx.error();
    }

    $('board').addEventListener('click', (e) => {
      if (S.gameOver || S.animating || !S.selected) return;
      if (S.mode === 'ai' && S.turn === LIGHT) return;
      const rect = $('board').getBoundingClientRect();
      const x = (e.clientX - rect.left) * 800 / rect.width - PAD;
      const y = (e.clientY - rect.top) * 800 / rect.height - PAD;
      const col = Math.floor(x / CELL), row = Math.floor(y / CELL);
      const move = S.validMoves.find(m => m.to.row === row && m.to.col === col);
      if (move) applyMove(move);
    });

    async function applyMove(move) {
      stopTimer();
      S.animating = true;
      const piece = S.board[move.from.row][move.from.col];
      S.board[move.from.row][move.from.col] = null;
      S.board[move.to.row][move.to.col] = piece;
      for (const cap of move.captures) S.board[cap.row][cap.col] = null;

      // promote
      let crowned = false;
      if (!piece.king) {
        if (piece.side === DARK && move.to.row === 0) { piece.king = true; crowned = true; }
        if (piece.side === LIGHT && move.to.row === 7) { piece.king = true; crowned = true; }
      }

      buildPieces();
      renderPlayers();
      renderHighlights();
      if (move.captures.length) { sfx.capture(); burst(move.to.row, move.to.col); }
      else sfx.move();
      if (crowned) { sfx.king(); log(`<b>${currentSideName()}</b> crowned a king! 👑`); }
      else log(`<b>${currentSideName()}</b> moved ${move.captures.length ? 'with a capture' : ''}.`);
      await wait(280);

      // multi-jump continuation
      if (move.captures.length) {
        const more = getCaptureMoves(S.board, move.to.row, move.to.col);
        if (more.length) {
          S.forcedFrom = { row: move.to.row, col: move.to.col };
          S.selected = { row: move.to.row, col: move.to.col };
          S.validMoves = more;
          S.animating = false;
          setBanner(`${currentSideName()} must continue capturing`, S.turn);
          setHint(`<b>Forced capture</b>Continue the jump chain with the highlighted piece.`);
          renderHighlights();
          startTimer();
          if (S.mode === 'ai' && S.turn === LIGHT) setTimeout(aiMove, 500);
          return;
        }
      }

      S.forcedFrom = null;
      S.selected = null;
      S.validMoves = [];
      S.turn = S.turn === DARK ? LIGHT : DARK;
      S.animating = false;
      renderHighlights();
      checkGameOver();
      if (!S.gameOver) startTurn();
    }

    function checkGameOver() {
      const dark = countPieces(DARK), light = countPieces(LIGHT);
      if (!dark) return finishGame(LIGHT);
      if (!light) return finishGame(DARK);
      if (!allMovesForSide(S.turn).length) return finishGame(S.turn === DARK ? LIGHT : DARK);
    }

    function finishGame(winner) {
      S.gameOver = true;
      S.winner = winner;
      stopTimer();
      const won = winner === DARK;
      setBanner(won ? 'Victory!' : 'Defeat', winner);
      setHint(`<b>${won ? 'You won' : (S.mode === 'ai' ? aiName() + ' won' : 'Player 2 won')}</b>Open the menu to start another match.`);
      log(`<b>${winner === DARK ? 'Dark' : 'Light'}</b> wins the match! ${won ? '🏆' : '⚔️'}`);
      if (won) { sfx.win(); confetti(); }
      saveResult(winner);
    }

    function saveResult(winner) {
      try {
        const user = JSON.parse(localStorage.getItem('arenax_user') || 'null');
        if (user) {
          const won = winner === DARK;
          user.gamesPlayed = (user.gamesPlayed || 0) + 1;
          if (won) user.gamesWon = (user.gamesWon || 0) + 1;
          localStorage.setItem('arenax_user', JSON.stringify(user));
        }
        const act = JSON.parse(localStorage.getItem('arenax_activity') || '[]');
        act.unshift({ icon: '🔴', text: `Checkers ${winner === DARK ? 'victory' : 'defeat'} — ${winner === DARK ? 'You' : (S.mode === 'ai' ? aiName() : 'Player 2')} won`, ts: Date.now() });
        localStorage.setItem('arenax_activity', JSON.stringify(act.slice(0, 12)));
      } catch (e) {}
    }

    function startTurn() {
      S.selected = null;
      S.validMoves = [];
      renderHighlights();
      renderPlayers();
      const who = S.turn === DARK ? 'Your' : (S.mode === 'ai' ? `${aiName()}'s` : 'Player 2\'s');
      setBanner(`${who} turn`, S.turn);
      setHint(`<b>${currentSideName()} to move</b>${S.turn === DARK || S.mode === 'local' ? 'Select a piece, then tap a highlighted square.' : 'AI is thinking…'}`);
      startTimer();
      if (S.mode === 'ai' && S.turn === LIGHT) setTimeout(aiMove, 650 + Math.random() * 450);
    }

    function aiMove() {
      if (S.gameOver || S.turn !== LIGHT) return;
      const moves = allMovesForSide(LIGHT);
      if (!moves.length) return finishGame(DARK);
      const picked = chooseAIMove(moves);
      applyMove(picked);
    }

    function chooseAIMove(moves) {
      if (S.difficulty === 'easy') return moves[Math.floor(Math.random() * moves.length)];
      let best = moves[0], bestScore = -Infinity;
      for (const move of moves) {
        let score = 0;
        if (move.captures.length) score += 50 + move.captures.length * 30;
        if ((S.board[move.from.row][move.from.col]?.side === LIGHT) && move.to.row === 7) score += 30;
        score += (move.to.row * 2);
        if (S.difficulty === 'hard') {
          score += centrality(move.to.row, move.to.col) * 4;
          score += safetyScore(move) * 6;
        } else {
          score += centrality(move.to.row, move.to.col) * 2;
        }
        score += Math.random() * (S.difficulty === 'easy' ? 15 : S.difficulty === 'medium' ? 6 : 2);
        if (score > bestScore) { bestScore = score; best = move; }
      }
      return best;
    }

    function centrality(r, c) {
      return 4 - Math.abs(3.5 - r) - Math.abs(3.5 - c);
    }
    function safetyScore(move) {
      const board = cloneBoard(S.board);
      const piece = { ...board[move.from.row][move.from.col] };
      board[move.from.row][move.from.col] = null;
      board[move.to.row][move.to.col] = piece;
      for (const cap of move.captures) board[cap.row][cap.col] = null;
      const oppMoves = [];
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
        const p = board[r][c];
        if (!p || p.side !== DARK) continue;
        oppMoves.push(...getCaptureMoves(board, r, c));
      }
      return oppMoves.some(m => m.to.row === move.to.row && m.to.col === move.to.col) ? -5 : 3;
    }

    function burst(row, col) {
      const svg = $('board');
      const layer = $('highlightLayer');
      const p = coord(row, col);
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const c = mk('circle', { cx:p.x, cy:p.y, r:4, fill: i % 2 ? '#ffe7a6' : '#f25c5c', opacity:1 }, layer);
        c.animate([
          { transform:'translate(0,0)', opacity:1 },
          { transform:`translate(${Math.cos(a) * 42}px, ${Math.sin(a) * 42}px)`, opacity:0 }
        ], { duration:480, easing:'cubic-bezier(.1,.7,.3,1)' }).onfinish = () => c.remove();
      }
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    function confetti() {
      const colors = ['#ffe7a6', '#d8a43b', '#e14b4b', '#fff'];
      for (let i = 0; i < 65; i++) {
        const b = document.createElement('div');
        b.className = 'confetti-bit';
        b.style.left = Math.random() * 100 + 'vw';
        b.style.background = colors[i % colors.length];
        b.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
        b.style.animationDelay = (Math.random() * .7) + 's';
        b.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 4200);
      }
    }

    function resetGame(mode) {
      stopTimer();
      S.mode = mode;
      S.board = initBoardState();
      S.turn = DARK;
      S.selected = null;
      S.validMoves = [];
      S.forcedFrom = null;
      S.gameOver = false;
      S.winner = null;
      buildBoard();
      renderPlayers();
      $('log').innerHTML = '';
      log(`<b>${mode === 'ai' ? 'You vs ' + aiName() : 'Player 1 vs Player 2'}</b> — Dark moves first.`);
      startTurn();
    }

    function showMenu() {
      stopTimer();
      $('menuModal').classList.add('show');
    }
    function backToMenu() {
      $('aiModal').classList.remove('show');
      $('menuModal').classList.add('show');
    }
    function pickMode(mode) {
      $('menuModal').classList.remove('show');
      if (mode === 'ai') $('aiModal').classList.add('show');
      else resetGame('local');
    }
    document.querySelectorAll('.diff-btn').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('selected'));
      btn.classList.add('selected');
      S.difficulty = btn.dataset.diff;
    }));
    function startAIGame() {
      $('aiModal').classList.remove('show');
      resetGame('ai');
    }

    function toggleSound() {
      soundOn = !soundOn;
      localStorage.setItem('checkers_sound', soundOn ? 'on' : 'off');
      $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
      if (soundOn) beep(420,.07,'sine',.08);
    }

    $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
    $('soundBtn').addEventListener('click', toggleSound);
    $('menuBtn').addEventListener('click', showMenu);
    $('restartBtn').addEventListener('click', showMenu);

    S.board = initBoardState();
    buildBoard();
    renderPlayers();
    setBanner('Choose a mode', DARK);
    setHint('<b>Select AI or local mode</b>Open the match menu to begin.');
  </script>
</body>
</html>
