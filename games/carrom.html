<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ArenaX — Carrom Clash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/carrom.css" />
</head>
<body>

  <!-- === Menu Screen === -->
  <div class="screen menu-screen" id="menuScreen">
    <div class="menu-brand">
      <div class="menu-logo">CARROM CLASH</div>
      <div class="menu-subtitle">Strike · Pocket · Dominate</div>
    </div>

    <div class="menu-card">
      <h2>Difficulty</h2>
      <div class="diff-select">
        <button class="diff-btn" id="btnAiEasy" data-diff="easy">Easy</button>
        <button class="diff-btn active" id="btnAiMed" data-diff="medium">Medium</button>
        <button class="diff-btn" id="btnAiHard" data-diff="hard">Hard</button>
      </div>

      <button class="btn btn-primary js-start" id="btnPlayAi" style="width:100%;">
        🎯 Play vs AI
      </button>
      <button class="btn btn-secondary" id="btnLocal" style="width:100%;">
        👥 Local 2-Player
      </button>
      <button class="btn btn-secondary" id="btnOnline" style="width:100%;">
        🌐 Play Online
      </button>

      <p class="menu-tip">Use mouse or touch: tap to place, drag back to aim, release to strike.</p>
    </div>
  </div>

  <!-- === Game Screen === -->
  <div class="screen game-screen hidden" id="gameScreen">
    <!-- Header -->
    <div class="game-header">
      <div class="player-info" id="p1Info">
        <div class="player-dot white-dot"></div>
        <div class="player-meta">
          <span class="player-name">You</span>
          <span class="player-score">0</span>
        </div>
      </div>

      <div class="center-pills">
        <div class="queen-status queen-active" id="queenStatus">👑 Queen Active</div>
        <div class="turn-indicator" id="turnIndicator">Your Turn</div>
      </div>

      <div class="player-info" id="p2Info">
        <div class="player-meta">
          <span class="player-score">0</span>
          <span class="player-name">AI</span>
        </div>
        <div class="player-dot black-dot"></div>
      </div>

      <button class="btn-icon" id="btnSound" title="Toggle sound">🔊</button>
    </div>

    <!-- Board -->
    <div class="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Instruction bar -->
    <div class="instruction-bar" id="instruction">
      Tap to position striker, then drag back to aim and release to shoot
    </div>
  </div>

  <!-- === Result Modal === -->
  <div class="modal-backdrop" id="resultModal">
    <div class="modal">
      <h2 id="resultTitle" class="winner-text">🏆 You Win!</h2>
      <p id="resultMsg">Final: 0 - 0</p>
      <div class="modal-btns">
        <button class="btn btn-primary" id="btnRematch">🔄 Rematch</button>
        <button class="btn btn-secondary" id="btnMenu">🏠 Menu</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/socket-client.js?v=9"></script>
  <script src="../js/online-mode.js?v=9"></script>
  <script src="../js/game-common.js"></script>
  <script>
    // === ArenaX GameCommon integration (wager, toolbar, timers, result) ===
    (function () {
      let carromStart = null;
      let carromGetGame = null;

      // Called by the game bundle once it has initialized
      window.setupCarromGameCommon = function ({ startGame, backToMenu, getGame }) {
        carromStart = startGame;
        carromGetGame = getGame;
        // Keep the game's audio engine in sync with the shared mute toggle
        const g = carromGetGame && carromGetGame();
        if (g && g.setMute) g.setMute(!window.gameCommon.isSoundOn());
        // The shared toolbar has its own sound button — hide the in-header one
        const hdrBtn = document.getElementById('btnSound');
        if (hdrBtn) hdrBtn.style.display = 'none';

        // Wrap local/AI start so the shared wager overlay is shown first.
        function getSelectedDifficulty() {
          const active = document.querySelector('.diff-btn.active');
          return active?.dataset?.diff || 'medium';
        }
        const startWithWager = (mode, difficulty) => {
          window.gameCommon.startWithWager(() => startGame(mode, difficulty));
        };
        const replaceBtn = (id, handler) => {
          const btn = document.getElementById(id);
          if (!btn) return;
          const clone = btn.cloneNode(true);
          btn.parentNode.replaceChild(clone, btn);
          clone.addEventListener('click', handler);
        };
        replaceBtn('btnPlayAi', () => startWithWager(window.CARROM_GAME_MODE.AI, getSelectedDifficulty()));
        replaceBtn('btnLocal', () => startWithWager(window.CARROM_GAME_MODE.LOCAL, 'medium'));
        // Online has its own matchmaking + wager flow inside the OnlineMode
        // modal, so it must NOT go through startWithWager().
        replaceBtn('btnOnline', () => window.onlineMode_carrom?.showModal());
      };

      window.gameCommon = new GameCommon({
        gameKey: 'carrom',
        gameName: 'Carrom Clash',
        autoWagerFlow: false,
        turnTimeLimit: 30,
        rulesHTML: `
          <h3>Objective</h3>
          <p>Pocket all of your coins before your opponent does. First to 25 points wins the pot.</p>
          <h3>How to play</h3>
          <p>Tap the board to place the striker on your baseline, drag back to aim, and release to shoot.</p>
          <h3>Queen</h3>
          <p>The red queen is worth bonus points — you must cover it by pocketing one of your coins on the following shot.</p>
          <h3>Wager</h3>
          <p>Winner takes the pot (wager × 2). Min 5 AX, max 1000 AX.</p>
        `,
        onStart: function () {
          // Wager locked — reveal the menu so the player picks a mode
          document.getElementById('menuScreen')?.classList.remove('hidden');
        },
        onExit: function () {
          window.location.href = '../index.html';
        }
      });

      // Sync game audio mute with the shared sound toggle
      const baseToggle = window.gameCommon.toggleSound.bind(window.gameCommon);
      window.gameCommon.toggleSound = function () {
        baseToggle();
        const g = carromGetGame && carromGetGame();
        if (g && g.setMute) g.setMute(!window.gameCommon.isSoundOn());
      };

      window.gameCommon.init();
    })();
  </script>
  <!-- Online (Quick-Match). Loaded after the gameCommon inline script above so
       the constructor picks up window.gameCommon. It reaches the engine lazily
       through window.carromApi, which the module below publishes once loaded,
       so load order between the two does not matter. -->
  <script src="carrom-online.js?v=9"></script>
  <script>
    if (window.CarromOnline) {
      window.onlineMode_carrom = new CarromOnline();
    }
  </script>
  <script type="module" src="carrom/main.js"></script>
</body>
</html>
